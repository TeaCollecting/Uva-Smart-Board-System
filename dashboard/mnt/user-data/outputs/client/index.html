<!doctype html><html><head><meta charset="utf-8"><title>USBTS Smart Board Agent</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#2a1215;--mut:#7a6468;--line:#ecdcc8;--teal:#7a1426;
--grad:linear-gradient(135deg,#5e0f1d 0%,#7a1426 55%,#9b1c33 100%)}
@media (prefers-color-scheme:dark){:root{--bg:#1b0b0f;--card:#2a1218;--ink:#fdf3e4;--mut:#d6bcb2;--line:#4d2430;--teal:#fbbf24}}
*{box-sizing:border-box}
body{font-family:system-ui,'Noto Sans Sinhala',sans-serif;margin:0;padding:18px;color:var(--ink);min-height:100vh;
background:var(--bg)}
h3{border-bottom:5px solid #fbbf24;margin:0 0 14px;padding:14px 16px;border-radius:14px;background:var(--grad);color:#fff;font-size:18px;box-shadow:0 6px 18px rgba(122,20,38,.25)}
h3{display:flex;align-items:center;gap:12px}h3 img{height:54px;width:54px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}h3 small{display:block;font-weight:400;font-size:11px;color:#fde68a}
#setup{background:var(--card);padding:10px 14px;border-radius:14px;box-shadow:0 6px 18px rgba(122,20,38,.12);animation:pop .35s ease}
input,button,select{display:block;width:100%;padding:11px 12px;margin:8px 0;font-size:14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;transition:border-color .15s,box-shadow .15s,transform .12s,filter .15s}
input:focus,select:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(251,191,36,.5)}
button{background:var(--grad);color:#fff;border:0;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(122,20,38,.3)}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}button:active{transform:scale(.97)}
#reset{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:none}
pre{white-space:pre-wrap;background:var(--card);padding:14px;border-radius:14px;border-left:6px solid #fbbf24;box-shadow:0 6px 18px rgba(122,20,38,.12);font-family:inherit;line-height:1.5}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head>
<body><h3><img src="logo.png" alt="USBTS"><span>USBTS Smart Board Agent<small>Uva Smartboard Tracking System</small></span></h3>
<div id="setup" style="display:none">
  <select id="dist"></select>
  <select id="zone"></select>
  <select id="school"></select>
  <input id="name" placeholder="Board name (e.g. Board-01)">
  <input id="loc" placeholder="Classroom (e.g. Grade 10A)">
  <button id="save">Register</button>
</div>
<pre id="info">Starting...</pre>
<button id="reset" style="display:none">Reset registration</button>
<script>/* hide CommonJS so the Firebase browser bundles register the global "firebase" */
window.__m = window.module; window.__e = window.exports; window.module = undefined; window.exports = undefined;</script>
<script src="node_modules/firebase/firebase-app-compat.js"></script>
<script src="node_modules/firebase/firebase-auth-compat.js"></script>
<script src="node_modules/firebase/firebase-firestore-compat.js"></script>
<script src="node_modules/firebase/firebase-database-compat.js"></script>
<script>window.module = window.__m; window.exports = window.__e;</script>
<script src="renderer.js"></script></body></html>
