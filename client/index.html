<!doctype html><html><head><meta charset="utf-8"><title>Smart Board Agent</title>
<style>body{font-family:system-ui,'Noto Sans Sinhala',sans-serif;padding:20px;color-scheme:light dark}
input,button,select{display:block;width:100%;padding:10px;margin:8px 0;box-sizing:border-box;font-size:14px}
pre{white-space:pre-wrap}</style></head>
<body><h3>Smart Board Agent</h3>
<div id="setup" style="display:none">
  <select id="dist"></select>
  <select id="zone"></select>
  <select id="school"></select>
  <input id="name" placeholder="Board name (e.g. Board-01)">
  <input id="loc" placeholder="Classroom (e.g. Grade 10A)">
  <button id="save">Register</button>
</div>
<pre id="info">Starting...</pre>
<button id="reset" style="display:none">Reset registration</button>
<script>/* hide CommonJS so the Firebase browser bundles register the global "firebase" */
window.__m = window.module; window.__e = window.exports; window.module = undefined; window.exports = undefined;</script>
<script src="node_modules/firebase/firebase-app-compat.js"></script>
<script src="node_modules/firebase/firebase-auth-compat.js"></script>
<script src="node_modules/firebase/firebase-firestore-compat.js"></script>
<script src="node_modules/firebase/firebase-database-compat.js"></script>
<script>window.module = window.__m; window.exports = window.__e;</script>
<script src="renderer.js"></script></body></html>
